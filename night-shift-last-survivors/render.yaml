# NIGHT SHIFT — LAST SURVIVORS | Deploy gratuito su Render
# Repository esistente: cartella night-shift-last-survivors/ (rootDir definita sotto).
services:
  - type: web
    name: night-shift-last-survivors
    runtime: node
    rootDir: night-shift-last-survivors
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
